[workspace]

[package]
name = "stateless-validator-evm-sail-zisk"
version = "0.1.0"
edition = "2024"

[dependencies]
ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", rev = "64a1f1664184e76053686745d50c6b9aaa51b034", default-features = false, features = [
    "inputcpy",
] }

[profile.release]
codegen-units = 1
lto = "fat"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zisk_hints)',
    'cfg(zisk_hints_debug)',
    'cfg(target_vendor, values("zisk"))',
] }
