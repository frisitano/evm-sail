# Required, read-only validation for every maintained model surface. Toolchain
# and corpus identities live in config/, while this workflow only restores
# verified caches and invokes Make's public aggregate targets.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install the configured clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-format-${LLVM_MAJOR}"
          echo "CLANG_FORMAT=clang-format-${LLVM_MAJOR}" >> "$GITHUB_ENV"
          "clang-format-${LLVM_MAJOR}" --version
      - run: make check-optimized-ffi
      - run: make ffi-clang-format-check

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - run: make check-contracts check-public-targets

  python-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - run: make python-tools-check

  rocq-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
        with:
          ocaml-compiler: ${{ env.ROCQ_OCAML }}
      - run: opam install -y rocq-prover.${{ env.ROCQ_VERSION }}
      - run: make rocq-contracts-check SAIL=true

  sail-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          z3 --version
      - uses: ./.github/actions/setup-sail

  sail:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make check lint fmt-check runtime-test

  c-spec:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-c-spec

  c-optimised:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3 and LLVM
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            z3 libgmp-dev pkg-config "clang-${LLVM_MAJOR}" \
            "clang-format-${LLVM_MAJOR}" "clang-tidy-${LLVM_MAJOR}"
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "CLANG=clang-${LLVM_MAJOR}"
            echo "CLANG_FORMAT=clang-format-${LLVM_MAJOR}"
            echo "CLANG_TIDY=clang-tidy-${LLVM_MAJOR}"
          } >> "$GITHUB_ENV"
          z3 --version
          "clang-${LLVM_MAJOR}" --version
          "clang-format-${LLVM_MAJOR}" --version
          "clang-tidy-${LLVM_MAJOR}" --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-c-optimised

  lean:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deps/lean-sail
            ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ hashFiles('config/toolchains.toml', 'extractions/lean/src/lean-toolchain', 'extractions/lean/src/lake-manifest.json') }}
      - name: Install and identify Z3 and Lean dependencies
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config elan
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
          elan toolchain install "$LEAN_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-lean

  rocq:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: opam repo add coq-released https://coq.inria.fr/opam/released
      - run: opam install -y rocq-prover.${{ env.ROCQ_VERSION }} rocq-stdpp.${{ env.ROCQ_STDPP }} rocq-sail-stdpp.${{ env.ROCQ_SAIL_STDPP }}
      - run: make verify-rocq

  python-model:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-python

  corpus:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - name: Compute exact corpus cache key
        id: corpus-key
        run: uv run --frozen python -m devtools.corpus cache-key --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zkvm/.fixtures/current-v2106-full
          key: ${{ runner.os }}-${{ steps.corpus-key.outputs.key }}
      - name: Restore native runner dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zkvm/accel-host/target
          key: cargo-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zkvm/accel-host/Cargo.lock', 'zkvm/accel-host/Cargo.toml', 'zkvm/accel-host/src/**') }}
          restore-keys: cargo-native-v2-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fetch --locked --manifest-path zkvm/accel-host/Cargo.toml
      # Recheck sources/toolchain after restoring the accelerator library.
      - run: cargo build --locked --release --offline --manifest-path zkvm/accel-host/Cargo.toml
      - uses: ./.github/actions/setup-sail
      - run: make verify-corpus
      - name: Upload corpus failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-failure-log
          path: build/logs/corpus.log
          if-no-files-found: warn

  historical:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EVM_NATIVE_RESOURCES: historical
      EXECSPECS_ROOT: ${{ github.workspace }}/.agent-tmp/historical-suite/execution-specs
      EXECSPECS_PY: ${{ github.workspace }}/.agent-tmp/historical-suite/execution-specs/.venv/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - name: Restore native runner dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zkvm/accel-host/target
          key: cargo-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zkvm/accel-host/Cargo.lock', 'zkvm/accel-host/Cargo.toml', 'zkvm/accel-host/src/**') }}
          restore-keys: cargo-native-v2-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fetch --locked --manifest-path zkvm/accel-host/Cargo.toml
      - run: cargo build --locked --release --offline --manifest-path zkvm/accel-host/Cargo.toml
      - uses: ./.github/actions/setup-sail
      # Cache reference data, never native model libraries or virtualenvs.
      # Exact keys avoid mixing generation identities. Model-only changes
      # reuse fixtures but still rebuild, audit and replay both backends.
      - name: Restore historical reference fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .agent-tmp/historical-suite/filled-*.json
            .agent-tmp/historical-suite/*/main.json
            .agent-tmp/historical-suite/*/extra.json
            .agent-tmp/historical-suite/*/*/source
            .agent-tmp/historical-suite/*/*/ssz
            .agent-tmp/historical-suite/*/*/export.log
          key: historical-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/corpora/historical-conversion-limits.json', 'devtools/harness/**/*.py', 'devtools/tests/historical_suite.py', 'devtools/tests/full_fork_selection.py', 'devtools/tests/audit_synthesized.py', 'pyproject.toml', 'uv.lock') }}
      - name: Full historical suite on both native backends
        run: make historical-suite-test
      - name: Focused native regressions on both backends
        shell: bash
        run: |
          mkdir -p build/logs
          make memory-regression-test sender-regression-test historical-regression-test \
            stateless-boundary-test MEMORY_REGRESSION_ARGS=--no-rebuild \
            2>&1 | tee build/logs/historical-focused.log
      - name: Upload historical failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-failure-evidence
          path: |
            .agent-tmp/historical-suite/**/*.log
            .agent-tmp/historical-suite/**/audit.json
            .agent-tmp/historical-suite/filled-*.json
            build/logs/historical-focused.log
          include-hidden-files: true
          if-no-files-found: warn
