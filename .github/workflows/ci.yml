# Required, read-only validation for every maintained model surface. Toolchain
# and corpus identities live in config/, while this workflow only restores
# verified caches and invokes Make's public aggregate targets.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
      - run: make check-optimized-ffi
      - run: make ffi-clang-format-check

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - run: make check-contracts check-public-targets

  python-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - run: make python-tools-check

  rocq-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
        with:
          ocaml-compiler: ${{ env.ROCQ_OCAML }}
      - run: opam install -y rocq-prover.${{ env.ROCQ_VERSION }}
      - run: make rocq-contracts-check SAIL=true

  sail-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - uses: ./.github/actions/setup-sail

  sail:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sail_smt_cache
          key: z3-memo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make check lint fmt-check runtime-test

  c-spec:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sail_smt_cache
          key: z3-memo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-c-spec

  c-optimised:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            z3 libgmp-dev pkg-config clang clang-format clang-tidy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sail_smt_cache
          key: z3-memo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-c-optimised

  lean:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/deps/lean-sail
            ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ hashFiles('config/toolchains.toml', 'extractions/lean/src/lean-toolchain', 'extractions/lean/src/lake-manifest.json') }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config elan
          elan toolchain install "$LEAN_TOOLCHAIN"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sail_smt_cache
          key: z3-memo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-lean

  rocq:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
        with:
          ocaml-compiler: ${{ env.ROCQ_OCAML }}
      - run: opam install -y rocq-prover.${{ env.ROCQ_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sail_smt_cache
          key: z3-memo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-rocq

  python-model:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sail_smt_cache
          key: z3-memo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-python

  corpus:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python-tools
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sail_smt_cache
          key: z3-memo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - name: Compute exact corpus cache key
        id: corpus-key
        run: uv run --frozen python -m devtools.corpus cache-key --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zkvm/.fixtures/current-v062-full
          key: ${{ runner.os }}-${{ steps.corpus-key.outputs.key }}
      - name: Restore native runner dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zkvm/accel-host/target
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zkvm/accel-host/Cargo.lock', 'zkvm/accel-host/Cargo.toml') }}
      - run: cargo fetch --locked --manifest-path zkvm/accel-host/Cargo.toml
      - uses: ./.github/actions/setup-sail
      - run: make verify-corpus
      - name: Upload corpus failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-failure-log
          path: build/logs/corpus.log
          if-no-files-found: warn
