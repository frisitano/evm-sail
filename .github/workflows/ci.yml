# Required, read-only validation for every maintained model surface. Toolchain
# and corpus identities live in config/, while this workflow only restores
# verified caches and invokes Make's public aggregate targets.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install the configured clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-format-${LLVM_MAJOR}"
          echo "CLANG_FORMAT=clang-format-${LLVM_MAJOR}" >> "$GITHUB_ENV"
          "clang-format-${LLVM_MAJOR}" --version
      - run: make check-optimized-ffi
      - run: make ffi-clang-format-check

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - run: make check-contracts check-public-targets

  python-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - run: make python-tools-check

  rocq-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
        with:
          ocaml-compiler: ${{ env.ROCQ_OCAML }}
      - run: opam install -y rocq-prover.${{ env.ROCQ_VERSION }}
      - run: make rocq-contracts-check SAIL=true

  sail-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          z3 --version
      - uses: ./.github/actions/setup-sail

  sail:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make check lint fmt-check runtime-test

  c-spec:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-c-spec

  c-optimised:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3 and LLVM
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            z3 libgmp-dev pkg-config "clang-${LLVM_MAJOR}" \
            "clang-format-${LLVM_MAJOR}" "clang-tidy-${LLVM_MAJOR}"
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CLANG=clang-${LLVM_MAJOR}" >> "$GITHUB_ENV"
          echo "CLANG_FORMAT=clang-format-${LLVM_MAJOR}" >> "$GITHUB_ENV"
          echo "CLANG_TIDY=clang-tidy-${LLVM_MAJOR}" >> "$GITHUB_ENV"
          z3 --version
          "clang-${LLVM_MAJOR}" --version
          "clang-format-${LLVM_MAJOR}" --version
          "clang-tidy-${LLVM_MAJOR}" --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-c-optimised

  lean:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deps/lean-sail
            ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ hashFiles('config/toolchains.toml', 'extractions/lean/src/lean-toolchain', 'extractions/lean/src/lake-manifest.json') }}
      - name: Install and identify Z3 and Lean dependencies
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config elan
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
          elan toolchain install "$LEAN_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-lean

  rocq:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Resolve pinned toolchains
        run: uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: opam install -y rocq-prover.${{ env.ROCQ_VERSION }}
      - run: make verify-rocq

  python-model:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - uses: ./.github/actions/setup-sail
      - run: make verify-python

  corpus:
    needs: sail-compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-tools
      - name: Install and identify Z3
        id: z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config
          version="$(z3 --version | awk '{print $3}')"
          test "${version%%.*}" = "$SOLVER_Z3_SUPPORTED_MAJOR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          z3 --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sail_smt_cache
          key: z3-${{ steps.z3.outputs.version }}-memo${{ env.SOLVER_Z3_MEMO_SCHEMA }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('config/toolchains.toml', 'sail/**/*.sail', 'sail/evm.sail_project') }}
      - name: Compute exact corpus cache key
        id: corpus-key
        run: uv run --frozen python -m devtools.corpus cache-key --github-output >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zkvm/.fixtures/current-v062-full
          key: ${{ runner.os }}-${{ steps.corpus-key.outputs.key }}
      - name: Restore native runner dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zkvm/accel-host/target
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zkvm/accel-host/Cargo.lock', 'zkvm/accel-host/Cargo.toml') }}
      - run: cargo fetch --locked --manifest-path zkvm/accel-host/Cargo.toml
      - uses: ./.github/actions/setup-sail
      - run: make verify-corpus
      - name: Upload corpus failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-failure-log
          path: build/logs/corpus.log
          if-no-files-found: warn
