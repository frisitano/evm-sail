# Build and publish the literate specification book to GitHub Pages.
#
# The benchmark dataset (fixture catalog and per-fixture shards under
# book/docs/assets/generated/performance/) is COMMITTED, so this workflow only
# builds the site — it never runs the emulator. Refresh the dataset locally
# with tools/benchmark_zisk.py and commit the result; see the zkEVM benchmarks
# page for the recipe.
#
# The build is driven entirely through `make docs-site`, which:
#   1. syncs the repo-local uv docs environment from mkdocstrings-sail/uv.lock
#      (make docs-env; mkdocstrings-sail is checked into this repository),
#   2. runs the custom Sail compiler with --doc to produce book/.build/doc.json,
#   3. builds book/.build/lsp-index.json with sail-lsp-index,
#   4. generates the reference pages with sail-book-gen, and
#   5. runs a strict `mkdocs build` (Material theme + the sail-book plugin,
#      book/mkdocs.yml) into book/site.
# Every step is make-target-based, so repository layout can move without
# touching this workflow.

name: book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; queued runs wait rather than cancel so a
# finished build is never discarded mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 libgmp-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # TODO(toolchain): `make docs-site` requires this repository's CUSTOM
      # Sail compiler (resolved via zkvm/resolve_optimized_sail.sh; upstream
      # Sail is not a supported fallback). Provision it here and export
      # SAIL=<path>. Options:
      #   - build the feature compiler (rems-project/sail fork, branch
      #     implement-per-newtype-c-representation-overrides-in-sail) with
      #     ocaml/setup-ocaml@v3 + dune, cached by compiler commit; or
      #   - download a prebuilt binary artifact published by the compiler
      #     repository's own CI.
      # Until provisioning is implemented this step fails fast with a clear
      # message instead of silently using an incompatible sail.
      - name: Resolve custom Sail compiler
        run: |
          if SAIL_BIN="$(bash zkvm/resolve_optimized_sail.sh)"; then
            echo "SAIL=$SAIL_BIN" >> "$GITHUB_ENV"
          else
            echo "::error::custom Sail compiler unavailable on this runner; implement TODO(toolchain) in .github/workflows/book.yml"
            exit 1
          fi

      - name: Build book
        run: make docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/site

  deploy:
    # Publish from main only; manual dispatches on other refs still get the
    # build check without touching the published site.
    if: github.ref == 'refs/heads/main'
    needs: build-book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
