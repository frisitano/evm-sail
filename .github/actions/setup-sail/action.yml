# Install this repository's CUSTOM Sail compiler onto PATH.
#
# Targets use `sail` from PATH and honour SAIL= for a different build. Upstream
# Sail is not a supported fallback, because the repository depends on
# spliceable type definitions and bound-driven C specialization that upstream
# does not have.
#
# The compiler is installed with `dune install`, which places its share tree and
# backend plugins where the binary finds them relative to itself. No wrapper
# script, and no SAIL_DIR or DUNE_DIR_LOCATIONS: those exist only to run an
# uninstalled build out of its _build directory.
#
# The build is cached on the compiler's commit, so only the first job on a new
# compiler revision pays for it. Workflows that fan out into several
# toolchain jobs should run one job first (see the `sail-compiler` job in
# ci.yml) so the others land on a warm cache instead of rebuilding in
# parallel.

name: Install the custom Sail compiler
description: Build (or restore) the custom Sail compiler and put it on PATH.

inputs:
  repository:
    description: Optional repository override for compiler-development workflows.
    required: false
    default: ""
  ref:
    description: Optional ref override for compiler-development workflows.
    required: false
    default: ""
  ocaml-compiler:
    description: Optional OCaml version override.
    required: false
    default: ""
  install-lsp:
    description: >
      Also build and install sail_lsp. The book build needs it for the
      semantic index; the lint and extraction jobs do not.
    required: false
    default: "false"
  lsp-repository:
    description: Optional sail-lsp repository override.
    required: false
    default: ""
  lsp-ref:
    description: Optional sail-lsp ref override.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve pinned toolchains
      shell: bash
      run: |
        uv run --frozen python -m devtools.toolchains --github-env >> "$GITHUB_ENV"
        if [ -n "${{ inputs.repository }}" ]; then echo "SAIL_REPOSITORY=${{ inputs.repository }}" >> "$GITHUB_ENV"; fi
        if [ -n "${{ inputs.ref }}" ]; then echo "SAIL_COMMIT=${{ inputs.ref }}" >> "$GITHUB_ENV"; fi
        if [ -n "${{ inputs.ocaml-compiler }}" ]; then echo "SAIL_OCAML=${{ inputs.ocaml-compiler }}" >> "$GITHUB_ENV"; fi
        if [ -n "${{ inputs.lsp-repository }}" ]; then echo "SAIL_LSP_REPOSITORY=${{ inputs.lsp-repository }}" >> "$GITHUB_ENV"; fi
        if [ -n "${{ inputs.lsp-ref }}" ]; then echo "SAIL_LSP_COMMIT=${{ inputs.lsp-ref }}" >> "$GITHUB_ENV"; fi

    - name: Check out the custom compiler
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ env.SAIL_REPOSITORY }}
        ref: ${{ env.SAIL_COMMIT }}
        path: .sail-compiler

    - name: Record the compiler revision
      shell: bash
      run: |
        echo "SAIL_COMMIT=$(git -C .sail-compiler rev-parse HEAD)" >> "$GITHUB_ENV"

    # Cache the whole _build tree: the install tree's bin/sail is a symlink into
    # _build/default, so caching only _build/install/default restores a dangling
    # link and the compiler looks built when it is not.
    - name: Restore the built compiler
      id: sail-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .sail-compiler/_build
        key: sail-${{ runner.os }}-${{ runner.arch }}-ocaml${{ env.SAIL_OCAML }}-${{ env.SAIL_COMMIT }}

    # The switch is needed even on a cache hit: the compiler links against
    # libraries from it at run time.
    - name: Set up OCaml
      uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
      with:
        ocaml-compiler: ${{ env.SAIL_OCAML }}
        opam-pin: false

    # Always install deps: dune itself comes from here, and a cache hit skips
    # the build below, so gating this too leaves the switch without dune.
    - name: Install compiler dependencies
      shell: bash
      working-directory: .sail-compiler
      run: opam install . --deps-only --yes

    - name: Build the compiler
      if: steps.sail-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .sail-compiler
      run: opam exec -- dune build --profile release

    - name: Install the compiler into the opam switch
      shell: bash
      run: |
        # Install into the switch rather than a private prefix, so the backend
        # plugins and share tree land where the binary finds them.
        (cd .sail-compiler && opam exec -- dune install)

        # dune install writes files; it does NOT tell opam's solver that
        # libsail is present. That matters for the sail-lsp step below, whose
        # `libsail` dependency would otherwise resolve to the PUBLIC package
        # and link the server against upstream Sail -- a wrong model rather
        # than an error. A version bound cannot express the difference: the
        # public package is 0.20.1 and BOTH this fork and upstream sail2 carry
        # 0.20.2, so only the source identifies it.
        #
        # No pin is needed here: sail-lsp names the fork in its own
        # pin-depends, and opam honours that from `opam install . --deps-only`
        # (verified: it resolves libsail from the pin, not the repository).
        prefix="$(opam var prefix)"
        if [ ! -x "$prefix/bin/sail" ]; then
          echo "::error::sail was not installed at $prefix/bin/sail"
          exit 1
        fi
        echo "$prefix/bin" >> "$GITHUB_PATH"
        echo "SAIL_PREFIX=$prefix" >> "$GITHUB_ENV"

    - name: Verify the installed compiler
      shell: bash
      run: |
        "$SAIL_PREFIX/bin/sail" --version
        # Backends are plugins, so execute each maintained backend over a tiny
        # model. Help text alone would not catch a missing or unloadable plugin.
        probe_dir="$(mktemp -d "${RUNNER_TEMP}/evm-sail-backend-probe.XXXXXX")"
        printf '%s\n' 'function main() -> unit = ()' > "$probe_dir/probe.sail"
        mkdir -p "$probe_dir/lean" "$probe_dir/rocq" "$probe_dir/python" \
          "$probe_dir/c" "$probe_dir/doc"
        "$SAIL_PREFIX/bin/sail" --lean --lean-output-dir "$probe_dir/lean" \
          -o probe "$probe_dir/probe.sail"
        "$SAIL_PREFIX/bin/sail" --coq --coq-output-dir "$probe_dir/rocq" \
          -o probe "$probe_dir/probe.sail"
        "$SAIL_PREFIX/bin/sail" --python -o "$probe_dir/python/probe" \
          "$probe_dir/probe.sail"
        "$SAIL_PREFIX/bin/sail" -c --c-no-main -o "$probe_dir/c/probe" \
          "$probe_dir/probe.sail"
        "$SAIL_PREFIX/bin/sail" --doc --doc-format identity \
          --doc-bundle doc.json -o "$probe_dir/doc" "$probe_dir/probe.sail"
        test -s "$probe_dir/lean/probe/Probe.lean"
        test -s "$probe_dir/rocq/probe.v"
        test -s "$probe_dir/python/probe.py"
        test -s "$probe_dir/c/probe.c"
        test -s "$probe_dir/doc/doc.json"

    # sail-lsp is a separate project that links against libsail. The book build
    # needs it for the semantic index (sail-lsp-index drives `sail_lsp`).
    - name: Check out sail-lsp
      if: inputs.install-lsp == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ env.SAIL_LSP_REPOSITORY }}
        ref: ${{ env.SAIL_LSP_COMMIT }}
        path: .sail-lsp

    - name: Install sail-lsp
      if: inputs.install-lsp == 'true'
      shell: bash
      working-directory: .sail-lsp
      run: |
        # libsail resolves to the fork named in sail-lsp's pin-depends, so this
        # cannot pull the public package.
        opam install . --deps-only --yes
        # @install rather than the default alias: the default builds the test
        # directory too, whose ppx_expect is a with-test dependency that
        # --deps-only does not install. This job wants the server binary, not
        # the test suite.
        opam exec -- dune build --profile release @install
        opam exec -- dune install
        if ! command -v sail_lsp >/dev/null 2>&1; then
          echo "::error::sail_lsp was not installed onto PATH"
          exit 1
        fi
        sail_lsp --version 2>/dev/null || true
